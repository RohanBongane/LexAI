{% extends "public_base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 150px);">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary"><i class="bi bi-bank me-2"></i>LexAI</h1>
            <p class="text-muted">Sign in to your legal workspace</p>
        </div>
        
        <div class="card border-0 shadow">
            <div class="card-body p-5">
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold small text-uppercase text-muted">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0 bg-light" id="email" name="email" required placeholder="name@company.com">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold small text-uppercase text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0 bg-light" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>
                    
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                    </div>
                    
                    <div class="text-center">
                        <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none fw-bold">Create one</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
